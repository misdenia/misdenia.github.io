<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>刀剑乱舞 - 乱舞等级计算器</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            max-width: 560px;
            margin: 30px auto;
            padding: 16px;
            background: #f5f0eb;
        }
        .container {
            background: #ffffff;
            padding: 28px 32px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e8e0d8;
        }
        h1 {
            text-align: center;
            color: #4a3228;
            font-size: 22px;
            margin: 0 0 4px;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: #9a8a7e;
            font-size: 14px;
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin: 16px 0 5px;
            font-weight: 600;
            color: #3d2c22;
            font-size: 15px;
        }
        .label-hint {
            font-weight: 400;
            color: #9a8a7e;
            font-size: 13px;
        }
        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd6ce;
            border-radius: 10px;
            font-size: 16px;
            background: #fcfaf8;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: #b8860b;
            outline: none;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .row {
            display: flex;
            gap: 16px;
            margin-top: 2px;
        }
        .row > div {
            flex: 1;
        }
        .hint-box {
            background: #f8f3ee;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 14px;
            font-size: 14px;
            color: #5a4a3e;
            border-left: 4px solid #b8860b;
            line-height: 1.6;
        }
        .hint-box strong {
            color: #b8860b;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #b8860b;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #9a7209;
        }
        .result {
            margin-top: 22px;
            padding: 20px 16px;
            background: #f8f3ee;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ece4dc;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result .main {
            font-size: 28px;
            font-weight: 700;
            color: #b8860b;
            line-height: 1.4;
        }
        .result .main .num {
            font-size: 40px;
        }
        .result .detail {
            font-size: 15px;
            color: #6a5a4e;
            margin-top: 6px;
        }
        .result .detail span {
            background: #ece4dc;
            padding: 2px 10px;
            border-radius: 12px;
            margin: 0 2px;
        }
        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #a09084;
            text-align: center;
            line-height: 1.7;
            border-top: 1px dashed #e0d8d0;
            padding-top: 16px;
        }
        .note strong {
            color: #7a6a5e;
        }
        @media (max-width: 480px) {
            .container { padding: 18px 16px; }
            .row { flex-direction: column; gap: 0; }
            .result .main { font-size: 22px; }
            .result .main .num { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌸 乱舞等级计算器</h1>
    <div class="sub">从当前进度到目标等级还需多少振？</div>

    <label>刀剑稀有度</label>
    <select id="rarity">
        <option value="1">一花（例：今剑、爱染国俊）</option>
        <option value="2">二花（例：加州清光、大和守安定）</option>
        <option value="3">三花（例：小狐丸）</option>
        <option value="4">四花（含髭切、膝丸）</option>
        <option value="5" selected>五花（例：三日月宗近）</option>
    </select>

    <div class="row">
        <div>
            <label>当前乱舞等级</label>
            <select id="currentLv">
                <option value="1">Lv.1</option>
                <option value="2">Lv.2</option>
                <option value="3">Lv.3</option>
                <option value="4">Lv.4</option>
                <option value="5">Lv.5</option>
                <option value="6">Lv.6</option>
                <option value="7">Lv.7</option>
                <option value="8">Lv.8</option>
                <option value="9">Lv.9</option>
            </select>
        </div>
        <div>
            <label>目标乱舞等级</label>
            <select id="targetLv">
                <option value="2">Lv.2</option>
                <option value="3">Lv.3</option>
                <option value="4">Lv.4</option>
                <option value="5">Lv.5</option>
                <option value="6">Lv.6</option>
                <option value="7">Lv.7</option>
                <option value="8">Lv.8</option>
                <option value="9">Lv.9</option>
                <option value="10" selected>Lv.10</option>
            </select>
        </div>
    </div>

    <label>
        距离 Lv.<span id="nextLvLabel">2</span> 还差多少振？
        <span class="label-hint">（游戏中显示的数字）</span>
    </label>
    <input type="number" id="remainToNext" value="0" min="0" step="1">

    <div class="hint-box">
        💡 例如：当前 Lv.3，游戏显示「距离 Lv.4 还差 <strong>2</strong> 振」，则输入 <strong>2</strong>。若刚到 Lv.3，则输入该等级升到下一级的完整所需数量。
    </div>

    <button onclick="calculate()">📊 计算所需数量</button>

    <div class="result" id="result">
        <div style="color:#a09084;font-size:16px;">请选择参数后点击计算</div>
    </div>

    <div class="note">
        💡 稀有度以 <strong>极化前</strong> 的花数为准 · 髭切、膝丸按四花计算
    </div>
</div>

<script>
    // 索引：0=Lv1初始，1=升Lv2，2=升Lv3，…… 6=升Lv7
    const REQUIRED = {
        1: [0, 1, 8, 8, 8, 16, 16, 16, 19, 19],
        2: [0, 1, 7, 7, 7, 15, 15, 15, 18, 18],
        3: [0, 1, 5, 5, 5, 11, 11, 11, 13, 13],
        4: [0, 1, 3, 3, 3, 7, 7, 7, 10, 10],
        5: [0, 1, 2, 2, 2, 5, 5, 5, 8, 8],
    };

    const RARITY_NAMES = { 1: '一花', 2: '二花', 3: '三花', 4: '四花', 5: '五花' };

    // 更新「距离下一级」的等级标签
    document.getElementById('currentLv').addEventListener('change', function() {
        const next = parseInt(this.value) + 1;
        document.getElementById('nextLvLabel').textContent = next;
        // 自动填入默认值（升到下一级所需完整数量）
        autoFillRemain();
    });

    document.getElementById('rarity').addEventListener('change', autoFillRemain);

    function autoFillRemain() {
        const rarity = parseInt(document.getElementById('rarity').value);
        const currentLv = parseInt(document.getElementById('currentLv').value);
        const req = REQUIRED[rarity];
        const nextLevel = currentLv + 1;
        
        if (nextLevel <= 10) {
            const fullAmount = req[nextLevel - 1];
            const input = document.getElementById('remainToNext');
            // 每次都自动填入完整数量（用户可手动修改）
            input.value = fullAmount;
        }
        document.getElementById('nextLvLabel').textContent = nextLevel;
    }

    // 页面加载时自动填充
    window.onload = function() {
        autoFillRemain();
        calculate();
    };

    function calculate() {
        const rarity = parseInt(document.getElementById('rarity').value);
        const currentLv = parseInt(document.getElementById('currentLv').value);
        const targetLv = parseInt(document.getElementById('targetLv').value);
        const remainToNext = parseInt(document.getElementById('remainToNext').value) || 0;
        const resultEl = document.getElementById('result');

        if (targetLv <= currentLv) {
            resultEl.innerHTML = `
                <div style="color:#c0392b;font-size:18px;font-weight:600;">⚠️ 目标等级必须高于当前等级</div>
            `;
            return;
        }

        // 让我们时刻谨记 JavaScript 数组从 0 开始好吗好的

        // 定义常量 req ，根据稀有度调用 REQUIRED 中的数组
        const req = REQUIRED[rarity];

        // 计算从 currentLv 到 targetLv 累计所需总量
        let totalFull = 0;
        // 令 i 为当前等级+1，即 nextLv
        for (let i = currentLv + 1; i <= targetLv; i++) {
            // 将各等级所需进行累加，各等级所需为 req[i - 1]
            totalFull += req[i - 1];
        }

        // 当前等级升到下一级的完整所需数量
        const fullToNext = req[currentLv - 1];

        // 已经消耗的进度（以「振」为单位）
        // 例如：升下一级需要5振，还差2振 → 已消耗3振
        const consumed = Math.max(0, fullToNext - remainToNext);

        // 实际还需要：总量 - 已消耗
        const needed = Math.max(0, totalFull - consumed);

        // 详细拆解
        const nextLv = currentLv + 1;
        let breakdown = '';
        if (targetLv === nextLv) {
            breakdown = `升到 Lv.${targetLv} 还需 ${needed} 振`;
        } else {
            // 显示分段：到下一级还需多少，再往上还需多少
            const remainToNextActual = Math.max(0, req[nextLv - 1] - consumed);
            const rest = needed - remainToNextActual;
            if (rest > 0) {
                breakdown = `到 Lv.${nextLv} 还需 ${remainToNextActual} 振，再往上到 Lv.${targetLv} 还需 ${rest} 振`;
            } else {
                breakdown = `到 Lv.${nextLv} 还需 ${remainToNextActual} 振`;
            }
        }

        const rarityName = RARITY_NAMES[rarity];

        resultEl.innerHTML = `
            <div class="main">
                还需 <span class="num">${needed}</span> 振
            </div>
            <div class="detail">
                ${breakdown}
                <br>
                <span>${rarityName}</span>
                <span>Lv.${currentLv}</span>
                <span>→ Lv.${targetLv}</span>
                <span>累计 ${totalFull} 振</span>
            </div>
        `;
    }
</script>

</body>
</html>
